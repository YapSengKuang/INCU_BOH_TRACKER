name: ESLint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '18 7 * * 4'

permissions:
  contents: read

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/eslint/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix tools/eslint

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: 'true'
        run: npm run lint -- --format ./tools/eslint/node_modules/@microsoft/eslint-formatter-sarif/sarif.js --output-file eslint-results.sarif

      - name: Upload analysis results to GitHub
        if: ${{ !cancelled() && hashFiles('eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
